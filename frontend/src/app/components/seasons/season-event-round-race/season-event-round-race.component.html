<div class="flex flex-column align-items-center w-full p-4">
  <div class="w-8" [ngStyle]="{ marginTop: '1rem', marginBottom: '1rem' }">
    <p-table
      [value]="raceDto.results"
      styleClass="p-datatable-striped p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th [style]="{ minWidth: '80px' }">Points</th>
          <th [style]="{ minWidth: '80px' }">Time</th>
          <th [style]="{ minWidth: '60px' }">Dist.</th>
          <th [style]="{ minWidth: '60px' }">Bon.</th>
          <th>Enter</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-result>
        <tr>
          <td class="text-gray-300">{{ result.position }}</td>
          <td
            class="white-space-nowrap"
            [style]="{
              maxWidth: '150px',
              overflow: 'hidden',
              textOverflow: 'ellipsis'
            }"
          >
            {{ result.car.name }}
          </td>
          <td class="font-bold">
            {{ result.points === 0 ? '-' : result.points.toFixed(3) }}
          </td>
          <td>{{ getTotalTime(result.sectorTimes) }}</td>
          <td>
            {{ result.distance }}
          </td>
          <td>
            {{ result.bonusesPoints }}
          </td>
          <td>
            <button
              type="button"
              pButton
              pRipple
              icon="pi pi-chevron-circle-right"
              ngClass="p-button-text p-button-sm"
              [ngStyle]="{ height: '2px', width: '2px' }"
              (click)="handleEnterHeat(result)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <div
    class="flex w-2 justify-content-between"
    [ngStyle]="{ marginBottom: '1rem' }"
  >
    <button
      pButton
      class="p-button"
      label="Gate 1"
      (click)="sendGateCommand(1)"
    ></button>
    <button
      pButton
      class="p-button"
      label="Gate 2"
      (click)="sendGateCommand(2)"
    ></button>
    <!-- <button
      *ngIf="next?.car?.name"
      pButton
      class="p-button"
      [label]="next?.car?.name ?? '-'"
      (click)="handleEnterHeat(next!!)"
    ></button>
    <button
      *ngIf="nextnext?.car?.name"
      pButton
      class="p-button"
      [label]="nextnext?.car?.name ?? '-'"
      (click)="handleEnterHeat(nextnext!!)"
    ></button> -->
  </div>
  <div class="flex w-10">
    <app-time-trial-heat
      *ngFor="let activeRaceResult of activeRaceResults"
      class="mr-4"
      [raceResult]="activeRaceResult"
      [ngStyle]="{ width: '25vw' }"
      (raceDataChanged)="handleRaceDataChange($event)"
      (raceStarted)="handleRaceStarted($event)"
      (raceDNFed)="handleRaceDNF($event)"
    ></app-time-trial-heat>
  </div>
</div>
